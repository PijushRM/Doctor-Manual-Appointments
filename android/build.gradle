buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "28.0.13004108"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Release builds: notifee (appointment reminders) fails Android's per-library
// resource check because its resources point at AppCompat colours it doesn't
// declare. The app's own resource linking still checks everything, so skip
// that one library check, for that one library only.
subprojects { sub ->
    if (sub.name == "notifee_react-native") {
        sub.tasks.configureEach { task ->
            if (task.name == "verifyReleaseResources") {
                task.enabled = false
            }
        }
    }
}
